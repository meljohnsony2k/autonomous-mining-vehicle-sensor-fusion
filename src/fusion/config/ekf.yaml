frequency: 30
sensor_timeout: 0.2
two_d_mode: true

map_frame: map
odom_frame: odom
base_link_frame: base_link
world_frame: map
publish_tf: false

imu0: /imu_scaled
imu0_config: [false, false, false,     # position x y z
              false,  false,  true,      # orientation x y z
              false, false, false,     # linear velocity x y z
              false,  false,  true,     # angular velocity x y z
              true,  true,  false]      # accelerations
imu0_differential: false
imu0_remove_gravitational_acceleration: true

# GPS（ navsat_transform_node  /odometry/gps）
odom0: /odometry/gps_scaled
odom0_config: [true, true, false,       # position x y z
              false, false, false,     # orientation x y z
              false, false, false,     # linear velocity
              false, false, false,     # angular velocity
              false, false, false]     # accelerations

odom0_differential: false
