frequency: 10
sensor_timeout: 0.2
two_d_mode: true

world_frame: map
map_frame: map

odom_frame: odom
base_link_frame: base_link

publish_tf: false

print_diagnostics: true

imu0: /imu_scaled
imu0_config: [false, false, false,     # position x y z
              false,  false,  true,      # orientation x y z
              false, false, false,     # linear velocity x y z
              false,  false,  true,     # angular velocity x y z
              false,  false,  false]      # accelerations
imu0_differential: false
#imu0_remove_gravitational_acceleration: true
#imu0_linear_acceleration_rejection_threshold: 5.0

# GPS（ navsat_transform_node  /odometry/gps）
odom0: /odometry/gps_scaled
odom0_config: [true, true, false,       # position x y z
              false, false, false,     # orientation x y z
              false, false, false,     # linear velocity
              false, false, false,     # angular velocity
              false, false, false]     # accelerations

odom0_differential: false
#odom0_relative: false
odom0_queue_size: 10
#odom0_pose_rejection_threshold: 1.0    # ignore large jumps in GPS
#odom0_twist_rejection_threshold: 1.0

odom1: /amcl_odom
odom1_config: [true, true, false,      # position x y z
               false, false, true,     # orientation x y z
               false, false, false,    # linear velocity
               false, false, false,    # angular velocity
               false, false, false]    # accelerations

odom1_differential: false
odom1_queue_size: 10

#process_noise_covariance: [
#  0.02, 0, 0, 0, 0, 0, 0, 0,        # x
#  0, 0.02, 0, 0, 0, 0, 0, 0,        # y
