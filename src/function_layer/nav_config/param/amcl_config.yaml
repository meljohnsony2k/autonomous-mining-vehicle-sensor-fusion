# Overall filter parameters
min_particles: 50
max_particles: 400
kld_err: 0.01
update_min_d: 0.2
update_min_a: 0.25
resample_interval: 2
selective_resampling: true
transform_tolerance: 1.0
recovery_alpha_slow: 0.0 
recovery_alpha_fast: 0.0
gui_publish_rate: 15.0 # 50Hz initiall

# Laser model parameteres
laser_max_range: -1.0
laser_min_range: -1.0
laser_max_beams: 400

laser_z_short: 0.05
laser_z_max: 0.05

# likelihood field, sum to 1
laser_z_hit: 0.95 #0.5
laser_z_rand: 0.05 #0.5

laser_sigma_hit: 0.2
laser_lambda_short: 0.1

laser_likelihood_max_dist: 2.0
laser_model_type: likelihood_field

# Odometry model parameters
odom_model_type: diff-corrected

odom_alpha1: 0.25 # theta/theta
odom_alpha2: 0.25 # theta/rho
odom_alpha3: 0.1 # rho/rho
odom_alpha4: 0.1 # rho/theta
odom_alpha5: 0.2 # only used for omni

base_frame_id: base_link
global_frame_id: map
odom_frame_id: odom 
use_map_topic: true
first_map_only: true